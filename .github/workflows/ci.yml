name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "terraform/**"
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: gitops-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gitops-app:ci ./app

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::678865629376:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag gitops-app:ci $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Update image tag in manifest
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          NEW_IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          sed -i "s|image: .*gitops-app:.*|image: ${NEW_IMAGE}|" k8s/deployment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yml
          git commit -m "ci: deploy ${{ github.sha }} [skip ci]" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
